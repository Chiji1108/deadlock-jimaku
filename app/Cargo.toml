[package]
name = "deadlock-jimaku"
edition.workspace = true
version.workspace = true
license-file.workspace = true

[dependencies]
overlays-core = { path = "../crates/core" }
# generate_context! が tauri.conf.json の plugins の設定を埋め込むのに使う
serde_json = "1.0.154"
tauri.workspace = true
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.54.1", features = ["net", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

# トレイは Mac と Windows だけ。workspace = true なら Tauri の CLI が全 OS で有効と見なさず、Linux に GPL の libayatana を同梱しない
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
