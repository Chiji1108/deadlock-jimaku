# Mac・Windows・Linux のインストーラーを作り、Actions の成果物に置く。
# PR と main で壊れていないかを確かめ（main のキャッシュはタグのビルドでも使える）、リリースでは release.yml から呼ぶ。
# Mac はリリースのときだけ Developer ID で署名して公証する（数分かかる）。それ以外はアドホック署名（tauri.conf.json）
name: build

on:
  pull_request:
    paths-ignore: ["**.md", "experiments/**", "web/**", "server/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "experiments/**", "web/**", "server/**"]
  # 手動の実行では、署名と公証をリリースの前に試せる
  workflow_dispatch:
    inputs:
      sign:
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE:
      APPLE_CERTIFICATE_PASSWORD:
      APPLE_API_ISSUER:
      APPLE_API_KEY:
      APPLE_API_KEY_P8:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple シリコンと Intel の両方で動く 1 つのアプリにする
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
          - os: windows-latest
            args: --bundles nsis
            bundle: target/release/bundle
          # 古い glibc で作ると、新しいディストリビューションでも動く
          - os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            bundle: target/release/bundle
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux のビルドに要るライブラリ（Tauri の WebView とマイク）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev patchelf
      - uses: jdx/mise-action@v2
        with:
          install_args: rust node pnpm
      - if: matrix.rust-targets
        run: rustup target add ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Tauri の CLI はリポジトリのルートから動かす（app/tauri.conf.json を探す）
      - if: ${{ !(inputs.sign && runner.os == 'macOS') }}
        run: frontend/node_modules/.bin/tauri build ${{ matrix.args }}
      # 証明書は Tauri が一時的なキーチェーンに読み込み、App Store Connect の API キーで公証する。
      # 鍵はこの手順にだけ渡す
      - name: 署名して公証する
        if: ${{ inputs.sign && runner.os == 'macOS' }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || { echo "Secret $name がない"; exit 1; }
          done
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          frontend/node_modules/.bin/tauri build ${{ matrix.args }}
          # Tauri が公証するのは中のアプリだけなので、ダウンロードして開く dmg も公証して印を付ける
          for dmg in ${{ matrix.bundle }}/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done
        env:
          # tauri.conf.json のアドホック署名（"-"）より優先される
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # インストーラーのファイル名は productName（デドロ字幕）から付く。GitHub のリリースは日本語のファイル名を
      # 書き換えるので、英数字にする（Linux は tauri.linux.conf.json で英数字の名前にしてある）
      - name: ファイル名を英数字にする
        run: |
          shopt -s nullglob
          for f in ${{ matrix.bundle }}/dmg/*.dmg ${{ matrix.bundle }}/nsis/*.exe; do
            mv "$f" "${f/デドロ字幕/dedoro-jimaku}"
          done
          # 書き換えられなかった（文字の表し方が違うなど）ら止める
          if ls ${{ matrix.bundle }}/{dmg,nsis,deb,rpm,appimage} 2>/dev/null | LC_ALL=C grep '[^ -~]'; then
            echo "英数字でないファイル名が残っている"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
