[tools]
lefthook = "2"
node = "26"
pnpm = "12"
rust = "1.99"

# experiments/ のスクリプト用の環境変数（OPENAI_API_KEY など）。アプリは読まない。ファイルがなくてもよい。コミットしない
[env]
_.file = ".env.local"

[tasks.dev]
description = "Tauri アプリを開発モードで起動する（Vite の HMR 付き）"
run = "frontend/node_modules/.bin/tauri dev"

[tasks.headless]
description = "Tauri なしで中核だけ起動し、ダミー字幕を流し続ける"
run = ["pnpm --dir frontend build", "cargo run -p overlays-core --bin overlays-headless -- --demo"]

[tasks.dmg-background]
description = "Mac の dmg の背景（app/dmg/background.html）を tiff に作り直す（1 倍と 2 倍。Chrome が要る）"
run = """
tmp=$(mktemp -d)
chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
"$chrome" --headless --disable-gpu --hide-scrollbars --window-size=660,400 --force-device-scale-factor=1 --screenshot="$tmp/bg.png" "file://$PWD/app/dmg/background.html"
"$chrome" --headless --disable-gpu --hide-scrollbars --window-size=660,400 --force-device-scale-factor=2 --screenshot="$tmp/bg@2x.png" "file://$PWD/app/dmg/background.html"
tiffutil -cathidpicheck "$tmp/bg.png" "$tmp/bg@2x.png" -out app/dmg/background.tiff
"""

[tasks.notices]
description = "配布物に入る第三者のライセンス表示（notices/third-party.txt）を作り直す"
run = "node frontend/scripts/notices.ts"

[tasks.font-samples]
description = "Google Fonts のフォントの見本の SVG を作り直し、カタログの言語と名前を確かめる（GitHub からフォントを取る）"
run = "node frontend/scripts/font-samples.ts"

[tasks.lp-fonts]
description = "LP の文字の見た目の見本のフォントを、見本の字だけの woff2 に作り直す（GitHub からフォントを取る）"
run = "node web/scripts/fonts.ts"

[tasks.check]
description = "整形・リント・型チェック・テストをまとめて実行する"
run = [
  "pnpm --dir frontend fmt:check",
  "pnpm --dir frontend lint",
  "pnpm --dir frontend check",
  "pnpm --dir web check",
  "pnpm --dir server check",
  "pnpm --dir frontend test",
  "pnpm --dir server test",
  "pnpm --dir web test",
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "node frontend/scripts/notices.ts --check",
  "node web/scripts/fonts.ts --check",
]
