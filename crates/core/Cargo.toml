[package]
name = "overlays-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "overlays_core"

[[bin]]
name = "overlays-headless"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
mime_guess = "2.0.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = "12.0.1"
