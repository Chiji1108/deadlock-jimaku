[package]
name = "overlays-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "overlays_core"

[[bin]]
name = "overlays-headless"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
dirs = "7.0.0"
futures-util = "0.3.34"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["json", "gzip"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = "12.0.1"

[dev-dependencies]
tempfile = "3.27.0"
