[package]
name = "overlays-core"
edition.workspace = true
version.workspace = true
license-file.workspace = true

[lib]
name = "overlays_core"

[[bin]]
name = "overlays-headless"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
audioadapter-buffers = "5.1"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
cpal = "0.18.2"
dirs = "7.0.0"
earshot = "1.2.2"
futures-util = "0.3.34"
hound = "3.5.1"
keyring = "4.2.0"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["json", "gzip", "multipart"] }
rubato = "5.0.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
# 読みの辞書（`dictionary/`）を読む。学習の機能（`train`）は、辞書を組み立てる例だけが使う
vibrato = { version = "0.5.3", default-features = false }
flate2 = "1"
jiter = "0.18.0"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# serde の `from` は型の形を変えないので、読めないという警告は要らない
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
fontdb = "0.24.0"
percent-encoding = "2.3.2"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
# 辞書を組み立てる例（`examples/build_dictionary.rs`）が、MeCab の重みから小さい辞書を作るのに使う
vibrato = { version = "0.5.3", features = ["train"] }
tempfile = "3.27.0"
