[package]
name = "overlays-core"
edition.workspace = true
version.workspace = true
license-file.workspace = true

[lib]
name = "overlays_core"

[[bin]]
name = "overlays-headless"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
audioadapter-buffers = "5.1"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
cpal = "0.18.2"
dirs = "7.0.0"
earshot = "1.2.2"
futures-util = "0.3.34"
hound = "3.5.1"
keyring = "4.2.0"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["json", "gzip", "multipart"] }
rubato = "5.0.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
jiter = "0.18.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = "12.0.1"

[dev-dependencies]
tempfile = "3.27.0"
