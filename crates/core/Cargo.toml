[package]
name = "overlays-core"
edition.workspace = true
version.workspace = true
license-file.workspace = true

[lib]
name = "overlays_core"

[[bin]]
name = "overlays-headless"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
audioadapter-buffers = "5.1"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
cpal = "0.18.2"
dirs = "7.0.0"
earshot = "1.2.2"
futures-util = "0.3.34"
hound = "3.5.1"
keyring = "4.2.0"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["json", "gzip", "multipart"] }
rubato = "5.0.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
# 読みの辞書（`dictionary/`）を読む。学習の機能（`train`）は、辞書を組み立てる例だけが使う
vibrato = { version = "0.5.3", default-features = false }
flate2 = "1"
# llama.cpp の Mac と Linux の配布物（tar.gz）を広げる
tar = { version = "0.4", default-features = false }
jiter = "0.18.0"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# serde の `from` は型の形を変えないので、読めないという警告は要らない
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
fontdb = "0.24.0"
percent-encoding = "2.3.2"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint"] }
# ゲームの画面を読む見本を、画面の大きさに縮める（`screen`）
image = { version = "0.25", default-features = false }

[dev-dependencies]
# 辞書を組み立てる例（`examples/build_dictionary.rs`）が、MeCab の重みから小さい辞書を作るのに使う
vibrato = { version = "0.5.3", features = ["train"] }
tempfile = "3.27.0"
# 画面を読めるかを測る例（`examples/heroes_eval.rs`、`items_eval.rs`）が、PNG を読むのに使う
image = { version = "0.25", default-features = false, features = ["png"] }

# 画面を取り込めるかを確かめる例（`examples/capture.rs`）が、Windows.Graphics.Capture を呼ぶのに使う
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
